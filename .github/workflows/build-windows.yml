name: Build Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Windows binary
        run: cargo build --bin goose --release --no-default-features --features "code-mode,aws-providers,telemetry,otel,rustls-tls,system-keyring"

      - name: Rename binary
        run: copy target\release\goose.exe alfa-opera-windows-x64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: alfa-opera-windows-x64
          path: alfa-opera-windows-x64.exe
          retention-days: 30
