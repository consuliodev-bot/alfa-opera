name: Build Desktop Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ui/goose2/src-tauri/target
          key: windows-tauri-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend deps
        working-directory: ui
        run: pnpm install --filter goose2...

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ui/goose2
          tauriScript: pnpm tauri
          args: --no-default-features

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: alfa-opera-windows-installer
          path: |
            ui/goose2/src-tauri/target/release/bundle/msi/*.msi
            ui/goose2/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
