name: Build Desktop Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ui/goose2/src-tauri/target
          key: windows-tauri-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install workspace deps
        working-directory: ui
        shell: pwsh
        run: |
          (Get-Content pnpm-workspace.yaml) -replace "  - 'desktop'", "" | Set-Content pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile

      - name: Build SDK
        working-directory: ui/sdk
        run: pnpm build

      - name: Build text package
        working-directory: ui/text
        run: pnpm build

      - name: Build goose CLI binary
        shell: pwsh
        run: |
          cargo build --bin goose --release --no-default-features --features "code-mode,aws-providers,telemetry,otel,rustls-tls,system-keyring"
          $src = "target\release\goose.exe"
          $dst = "target\release\goose-x86_64-pc-windows-msvc.exe"
          Copy-Item $src $dst
          Write-Host "Binary built: $(Get-Item $dst | Select-Object -ExpandProperty Length) bytes"

      - name: Install WebView2
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile 'webview2.exe'
          Start-Process -FilePath 'webview2.exe' -Args '/silent /install' -Wait

      - name: Build Tauri desktop app
        working-directory: ui/goose2
        shell: pwsh
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: alfa-opera-windows-desktop
          path: |
            ui/goose2/src-tauri/target/release/bundle/msi/*.msi
            ui/goose2/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
          if-no-files-found: warn
